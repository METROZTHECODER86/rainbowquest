name: Build qmod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install qpm
  run: cargo install qpm

  
      

      - name: Set up Android NDK 27
        run: |
          qpm ndk download 27
          qpm ndk pin 27

      - name: Restore dependencies
        run: qpm restore

      - name: Build
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build
          cmake --build ./build

      - name: Package qmod
        run: |
          qpm qmod manifest
          qpm qmod zip -i ./build/libRainbowQuest.so cover.png

      - uses: actions/upload-artifact@v4
        with:
          name: RainbowQuest-qmod
          path: RainbowQuest.qmod
          if-no-files-found: error
